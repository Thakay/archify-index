name: Demo site

# Publishes the demo only from a commit whose CI passed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Check out Archify v3.0.1
        uses: actions/checkout@v7.0.1
        with:
          repository: tt-a1i/archify
          ref: v3.0.1
          path: archify-src
          sparse-checkout: archify
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Render Archify's examples and index them
        run: npm run demo -- archify-src/archify/bin/archify.mjs
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
